[project]
name = "llmserve"
version = "0.1.0"
description = "An OpenAI compatible LLM inference gateway with continuous batching, prefix caching and routing"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44,<5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llmserve*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
